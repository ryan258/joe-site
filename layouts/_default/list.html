{{ define "main" }}
<section style="margin-bottom:28px;">
  <h1 style="font-size:2.2rem;font-weight:800;color:var(--text-pure);margin-bottom:8px;">{{ .Title }}</h1>
  {{ with .Description }}
  <p style="font-size:1.05rem;color:var(--text-med);max-width:800px;">{{ . }}</p>
  {{ end }}
</section>

<div class="content-prose">
  {{ .Content }}
</div>

<div class="plays-grid" style="margin-top:24px;">
  {{ range .Pages }}
  <div class="hud-panel">
    <h2 style="font-size:1.2rem;font-weight:700;margin-bottom:8px;"><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
    <p style="font-size:0.85rem;color:var(--text-med);">{{ .Summary }}</p>
  </div>
  {{ end }}
</div>
{{ end }}
