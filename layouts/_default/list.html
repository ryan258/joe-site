{{ define "main" }}
<section style="margin-bottom:32px;">
  <h1 style="font-size:2.35rem;font-weight:800;color:#f1f5f3;margin-bottom:10px;font-family:var(--font-display);letter-spacing:0.04em;text-transform:uppercase;">{{ .Title }}</h1>
  {{ with .Description }}
  <p style="font-size:1.05rem;color:var(--text-med);max-width:820px;line-height:1.6;">{{ . }}</p>
  {{ end }}
</section>

<div class="content-prose">
  {{ .Content }}
</div>

{{ if .Pages }}
<div class="plays-grid" style="margin-top:28px;">
  {{ range .Pages }}
  <div class="hud-panel" style="padding:22px;transition:all var(--transition-fast);">
    <h2 style="font-size:1.15rem;font-weight:700;margin-bottom:8px;font-family:var(--font-display);letter-spacing:0.03em;text-transform:uppercase;">
      <a href="{{ .RelPermalink }}" style="color:inherit;text-decoration:none;">{{ .Title }}</a>
    </h2>
    <p style="font-size:0.86rem;color:var(--text-med);line-height:1.5;">{{ .Summary }}</p>
  </div>
  {{ end }}
</div>
{{ end }}
{{ end }}
