<!DOCTYPE html>
<html lang="en-US">
{{ partial "head.html" . }}
<body>
  {{ partial "header.html" . }}

  <main class="main-shell">
    {{ block "main" . }}{{ end }}
  </main>

  {{ partial "footer.html" . }}
  {{ partial "hud-dock.html" . }}
  {{ partial "search-modal.html" . }}
  <div id="a11y-live-region" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>

  <!-- Base path for JS-built links (includes the /joe-site/ subpath on GitHub Pages) -->
  <script>
    const BASE_URL = '{{ "" | relURL }}'.replace(/\/$/, "");
  </script>

  <!-- Search index generated from all plays, spells, and reference pages -->
  {{ $searchIndex := partialCached "search-index.html" . "global" }}
  <script src="{{ $searchIndex.RelPermalink }}"></script>

  <!-- Core App JS -->
  {{ $js := resources.Get "js/app.js" }}
  <script src="{{ $js.RelPermalink }}"></script>

  <!-- PWA: register offline service worker -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register(BASE_URL + '/sw.js');
    }
  </script>
</body>
</html>
