{{ define "main" }}
{{ if .Params.play_id }}
{{ partial "play-single.html" . }}
{{ else }}
<article class="hud-panel single-article-card">
  <span class="modal-corner modal-corner--tl" aria-hidden="true">◇</span>
  <span class="modal-corner modal-corner--tr" aria-hidden="true">◇</span>
  <span class="modal-corner modal-corner--bl" aria-hidden="true">◇</span>
  <span class="modal-corner modal-corner--br" aria-hidden="true">◇</span>

  <header class="single-article-header">
    <h1 class="single-article-title">{{ .Title }}</h1>
    {{ with .Description }}
    <p class="single-article-desc">{{ . }}</p>
    {{ end }}
  </header>

  <div class="content-prose">
    {{ .Content }}
  </div>
</article>
{{ end }}
{{ end }}
