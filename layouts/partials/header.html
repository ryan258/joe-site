<header class="site-header">
  <div class="header-inner">
    <a href="/" class="brand-badge">
      <div class="brand-icon">⚡</div>
      <div class="brand-info">
        <span class="brand-title">Joe, Keeper of the Cow</span>
        <span class="brand-subtitle">Evoker Wizard 7 • D&D 5.5e Pilot</span>
      </div>
    </a>

    <nav>
      <ul class="main-nav">
        {{ $currentPage := . }}
        {{ range site.Menus.main }}
        <li>
          <a class="nav-link {{ if or ($currentPage.IsMenuCurrent "main" .) ($currentPage.HasMenuCurrent "main" .) }}active{{ end }}" href="{{ .URL }}">
            {{ .Name }}
          </a>
        </li>
        {{ end }}
      </ul>
    </nav>

    <div class="header-actions">
      <button class="quick-search-trigger" type="button" aria-label="Search">
        <span>🔍 Search Plays, Spells & Rules</span>
        <span class="kbd-badge">/</span>
      </button>
    </div>
  </div>
</header>
