<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} | {{ site.Title }}{{ end }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}">
  <meta name="author" content="{{ site.Params.author }}">

  <!-- OpenGraph / Social Meta -->
  <meta property="og:title" content="{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }}{{ end }}">
  <meta property="og:description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ .Permalink }}">
  <meta property="og:image" content="{{ "images/joe_hero.webp" | absURL }}">

  <!-- Google Fonts: Cinzel & Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <!-- Core Stylesheet (BEM Sass Pipeline) -->
  {{ $style := resources.Get "sass/main.scss" | toCSS (dict "outputStyle" "compressed") }}
  <link rel="stylesheet" href="{{ $style.RelPermalink }}">

  <!-- PWA: installable as a home-screen app (iPad / Android) -->
  <link rel="manifest" href="{{ "manifest.json" | relURL }}">
  <meta name="theme-color" content="#0c120e">
  <link rel="apple-touch-icon" href="{{ "images/apple-touch-icon.png" | relURL }}">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Joe's Cockpit">
</head>
