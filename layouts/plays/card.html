<article class="play-card" data-play-id="{{ .Params.play_id }}" data-actor="{{ .Params.actor }}" data-type="{{ .Params.type }}" data-tags="{{ delimit .Params.threat_tags " " }}" id="{{ .Params.play_id | lower }}">
  <div class="play-card-header">
    <div class="play-card-badges">
      <span class="play-id-tag">{{ .Params.play_id }}</span>
      <span class="tag-badge {{ if eq .Params.actor "cow" }}tag-fey{{ else }}tag-cyan{{ end }}">
        {{ if eq .Params.actor "cow" }}🦉 Cow{{ else }}🧙‍♂️ Joe{{ end }}
      </span>
      <span class="tag-badge tag-subtle">{{ .Params.type }}</span>
    </div>
    <a href="{{ .RelPermalink }}" class="play-card-expand-cta" aria-label="View details for {{ .Params.play_id }}: {{ .Title }}">
      Details <span class="play-card-expand-arrow">↗</span>
    </a>
  </div>

  <h3 class="play-title">
    <a href="{{ .RelPermalink }}" class="play-title-link">{{ .Title }}</a>
  </h3>

  <p class="play-card-pitch">{{ .Params.summary | markdownify }}</p>

  <div class="play-card-footer">
    {{ with .Params.threat_tags }}
    <div class="play-card-tags">
      {{ range . }}
        <span class="play-tag-chip">{{ . }}</span>
      {{ end }}
    </div>
    {{ else }}
      <div></div>
    {{ end }}

    {{ with .Params.table_phrase }}
      <button type="button" class="copy-phrase-btn counter-btn play-card-copy-btn" data-phrase="{{ . }}" title="Quick copy table phrase">
        📋 Copy Script
      </button>
    {{ end }}
  </div>

  <!-- Detailed Modal Payload Template -->
  <template class="play-modal-data">
    <div class="play-modal-content-wrap">
      <div class="play-modal-header-meta">
        <div class="play-modal-badges">
          <span class="play-id-tag play-id-tag--large">{{ .Params.play_id }}</span>
          <span class="tag-badge {{ if eq .Params.actor "cow" }}tag-fey{{ else }}tag-cyan{{ end }}">
            {{ if eq .Params.actor "cow" }}🦉 Cow Play{{ else }}🧙‍♂️ Joe Play{{ end }}
          </span>
          <span class="tag-badge tag-amber">{{ .Params.type }}</span>
          {{ with .Params.threat_tags }}
            {{ range . }}
              <span class="play-tag-chip play-tag-chip--modal">{{ . }}</span>
            {{ end }}
          {{ end }}
        </div>
        <a href="#{{ .Params.play_id | lower }}" class="play-modal-anchor-link" title="Direct link to this play">
          #{{ .Params.play_id | lower }}
        </a>
      </div>

      <h2 class="play-modal-title" id="play-modal-title">{{ .Title }}</h2>

      <div class="play-modal-body-mechanics">
        {{ .Content }}
      </div>

      {{ with .Params.table_phrase }}
      <div class="play-modal-table-phrase">
        <div class="play-modal-phrase-header">
          <span class="table-phrase-label">Table Phrasing & Verbal Script</span>
          <button type="button" class="copy-phrase-btn counter-btn play-modal-copy-btn" data-phrase="{{ . }}">
            📋 Copy Script
          </button>
        </div>
        <blockquote class="play-modal-quote">
          "{{ . }}"
        </blockquote>
      </div>
      {{ end }}
    </div>
  </template>
</article>
